# Builds the desktop installers (Windows .exe + portable .zip, macOS .dmg, Linux AppImage)
# and attaches them to a published GitHub Release. Run it by pushing a version tag, e.g.:
#   git tag v1.0.4 && git push origin v1.0.4   (the version comes from the tag)
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # create the release once, so the three builds below upload into the same one
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "RESONA $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # the inline fallback copy of the audio worklet must match capture-worklet.js
      - run: npm run check
      # the tag is the single source of truth for the version (v1.2.3 -> 1.2.3),
      # so electron-builder always publishes into the release that was just created
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
